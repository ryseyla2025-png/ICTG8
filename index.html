បច្ចេកវិទ្យាពពក (Cloud Technology ឬ Cloud Computing) គឺជាការផ្ដល់សេវាកម្មកុំព្យូទ័រតាមរយៈប្រព័ន្ធអ៊ីនធឺណិត ដែលរួមមានការផ្ទុកទិន្នន័យ ម៉ាស៊ីនមេ មូលដ្ឋានទិន្នន័យ បណ្ដាញ និងកម្មវិធីនានា។

![Cloud Computing Technology Diagram](https://image.pollinations.ai/prompt/cloud+computing+network+diagram+blue+theme+minimalist+vector+illustration?width=800&height=400&nologo=true)

ជំនួសឲ្យការទិញឧបករណ៍ផ្ទុកទិន្នន័យ (Hard Drive ឬ Flash Drive) អ្នកប្រើប្រាស់អាចរក្សាទុកឯកសារនៅលើម៉ាស៊ីនមេ (Servers) របស់ក្រុមហ៊ុនផ្ដល់សេវាដែលមានទីតាំងនៅឆ្ងាយៗកាត់សមុទ្រ (Data Centers)។

**២. ប្រភេទនៃសេវាកម្មពពក៖**
- **ការផ្ទុកទិន្នន័យ (Cloud Storage):** ឧទាហរណ៍ដូចជា Google Drive, OneDrive, និង iCloud។
- **កម្មវិធីលើពពក (Cloud Software - SaaS):** ដូចជា Google Docs, Office 365, ឬ Canva ដែលលោកអ្នកអាចប្រើប្រាស់កម្មវិធីផ្ទាល់លើ Web Browser ដោយមិនបាច់ដំឡើងលើកុំព្យូទ័រ។

**៣. អត្ថប្រយោជន៍នៃបច្ចេកវិទ្យាពពក៖**
- **ភាពបត់បែន និងងាយស្រួល (Accessibility):** អាចទាញយកទិន្នន័យនិងធ្វើការពីគ្រប់ទីកន្លែង ឬគ្រប់ឧបករណ៍ (ទូរសព្ទ តេប្លេត កុំព្យូទ័រ) ឲ្យតែមានការតភ្ជាប់អ៊ីនធឺណិត។
- **សន្សំសំចៃថវិកា:** មិនចាំបាច់ចំណាយលុយច្រើនទិញថាសរឹងធំៗ។
- **ការសហការគ្នាងាយស្រួល:** អនុញ្ញាតឲ្យមនុស្សច្រើននាក់អាចមើល និងកែប្រែឯកសារតែមួយក្នុងពេលតែមួយបានយ៉ាងរលូន។
- **សុវត្ថិភាពទិន្នន័យ:** ទិន្នន័យមិនងាយបាត់បង់ដូចបញ្ហាកុំព្យូទ័រខូច ធ្លាក់ទឹក ឬបាត់ទូរសព្ទ។

**៤. បញ្ហាប្រឈម៖**

",page:"១៥",objectives:["យល់ដឹងពីអត្ថន័យនៃប្រព័ន្ធអេកូឡូស៊ី ICT","កំណត់និងបែងចែកសមាសធាតុផ្សំសំខាន់ៗនៃប្រព័ន្ធអេកូឡូស៊ី ICT"],content:`**១. តើអ្វីទៅជាប្រព័ន្ធអេកូ ICT?**
នៅក្នុងជីវវិទ្យា **ប្រព័ន្ធអេកូឡូស៊ី (Ecosystem)** សំដៅលើបរិស្ថានដែលពឹងផ្អែកលើគ្នាទៅវិញទៅមករវាងរុក្ខជាតិ សត្វ និងអាកាសធាតុ។ 

![ICT Ecosystem Diagram](https://image.pollinations.ai/prompt/connected+smart+devices+ecosystem+iot+network+abstract+vector+flat+design?width=800&height=400&nologo=true)

ស្រដៀងគ្នានេះដែរក្នងបច្ចេកវិទ្យា **ប្រព័ន្ធអេកូ ICT (ICT Ecosystem)** គឺជាបណ្តុំដ៏ធំមួយនៃបច្ចេកវិទ្យា ឧបករណ៍រូបវន្ត បណ្ដាញ សេវាកម្ម និងមនុស្ស ដែលតភ្ជាប់និងធ្វើការរួមគ្នាដើម្បីសម្រេចការងារណាមួយ។ ប្រសិនបើផ្នែកណាមួយរអាក់រអួល វានឹងធ្វើឲ្យដំណើរការទាំងមូលមានបញ្ហា។

**២. សមាសធាតុសំខាន់ៗនៃប្រព័ន្ធអេកូ ICT៖**
- **ផ្នែករឹង និងឧបករណ៍ (Devices)៖** ទូរសព្ទឆ្លាតវៃ កុំព្យូទ័រ នាឡិកាឆ្លាតវៃ និងម៉ាស៊ីនមេ។
- **បណ្ដាញ (Networks)៖** ខ្សែកាបអុបទិក អង់តែន 4G/5G ប្រព័ន្ធ Wi-Fi និងផ្កាយរណប។
- **កម្មវិធី និងសេវាកម្ម (Software/Services)៖** កម្មវិធីទូរសព្ទ (Apps), ប្រព័ន្ធប្រតិបត្តិការ (iOS, Windows) និង Cloud Services។
- **ច្បាប់គោលនយោបាយ (Policies)៖** ច្បាប់គ្រប់គ្រងការប្រើប្រាស់ សុវត្ថិភាពអ៊ិនធឺណិត និងបទដ្ឋាននានា។
- **អ្នកប្រើប្រាស់ (Users)៖** មនុស្សដែលប្រើប្រាស់ អ្នកបង្កើតមាតិកា និងអ្នកសរសេរកម្មវិធីកូដ។

**៣. ឧទាហរណ៍ជាក់ស្តែងបរិយាកាស Ecosystem៖**
*ការធ្វើពាណិជ្ជកម្មអនឡាញ (E-Commerce):*
ដើម្បីចង់ទិញទំនិញអនឡាញ អ្នកប្រើប្រាស់ទូរសព្ទ (Device) ចូលកម្មវិធី App (Software) តាមរយៈ 4G (Network) បន្ទាប់មកទិញនិងបង់លុយយ៉ាងលឿនតាម App ធនាគារ ដោយទិន្នន័យបញ្ជូនទៅធនាគារកណ្តាលនិងអ្នកលក់យ៉ាងត្រឹមត្រូវ។ ទាំងអស់នេះគឺអាស្រ័យដោយការតភ្ជាប់គ្នានិងعملការជាប្រព័ន្ធតែមួយ។`,keywords:[{term:"ICT Ecosystem",definition:"បរិយាកាសទំនាក់ទំនងគ្នារវាងឧបករណ៍បច្ចេកវិទ្យា បណ្តាញ សេវាកម្ម និងអ្នកប្រើប្រាស់។"},{term:"Infrastructure",definition:"ហេដ្ឋារចនាសម្ព័ន្ធរូបវន្តសម្រាប់ឲ្យប្រព័ន្ធដើរ (ឧ. បង្គោលអង់តែន)។"}],quizzes:[{question:"តើសមាសធាតុណាមួយខាងក្រោមដែលមិនមែនជាផ្នែកនៃប្រព័ន្ធអេកូ ICT?",options:["កម្មវិធីកុំព្យូទ័រ និងសេវាកម្ម","ទូរសព្ទឆ្លាតវៃ","ព្រៃឈើ និងសត្វព្រៃ","បណ្តាញអ៉ីនធឺណិត"],correctAnswer:2,explanation:"ព្រៃឈើ និងសត្វព្រៃ គឺជាភាវរស់ក្នុងប្រព័ន្ធអេកូឡូស៊ីធម្មជាតិ មិនមែនអេកូបច្ចេកវិទ្យាទេ។"},{question:"តើអ្វីទៅជាប្រព័ន្ធអេកូ ICT (ICT Ecosystem)?",options:["ការដាំដើមឈើក្នុងទីក្រុង","បណ្តុំនៃបច្ចេកវិទ្យា ឧបករណ៍ បណ្តាញ សេវាកម្ម និងមនុស្សដែលធ្វើការរួមគ្នា","ប្រព័ន្ធអគ្គិសនីតែមួយមុខ","ចំណាត់ថ្នាក់សត្វល្អិត"],correctAnswer:1,explanation:"ICT Ecosystem គឺបរិយាកាសដែលតភ្ជាប់បច្ចេកវិទ្យា និងអ្នកប្រើប្រាស់ចូលគ្នាដូចជាបណ្តាញសំណាញ់។"},{question:"តើខ្សែកាបអុបទិក និងចានផ្កាយរណប ត្រូវបានចាត់ថ្នាក់ក្នុងសមាសធាតុណា?",options:["ផ្នែករឹង (Hardware)","បណ្តាញ (Networks)","ច្បាប់គោលនយោបាយ (Policies)","កម្មវិធី (Software)"],correctAnswer:1,explanation:"វាជាហេដ្ឋារចនាសម្ព័ន្ធបណ្តាញ ឬ Network ដែលជួយក្នុងការបញ្ជូនសញ្ញាអ៊ីនធឺណិត។"},{question:"តើនរណាជា 'អ្នកប្រើប្រាស់' ក្នុងប្រព័ន្ធអេកូ ICT?",options:["មានតែអ្នកសរសេរកូដប៉ុណ្ណោះ","មនុស្សទូទៅ អ្នកកែច្នៃមាតិកា និងអ្នកសរសេរកម្មវិធី","មនុស្សយន្តផ្កាយរណប","ម៉ាស៊ីនមេ (Servers)"],correctAnswer:1,explanation:"អ្នកប្រើប្រាស់ ឬ Users រាប់បញ្ចូលគ្រប់បុគ្គលទាំងអស់ដែលចូលរួមក្នុងប្រព័ន្ធ ICT មិនថាលេងបណ្តាញសង្គម ឬបង្កើតវា។"},{question:"ប្រសិនបើអង់តែន 4G នៅតំបន់មួយខូច តើមានអ្វីកើតឡើងដល់ប្រព័ន្ធអេកូ ICT ក្នុងស្រុកនោះ?",options:["គ្មានអ្វីខូចខាតទេ ព្រោះទូរសព្ទនៅបើកឆេះសន្សំថ្មធម្មតា","ធ្វើឲ្យកម្មវិធីអនឡាញមិនអាចទាក់ទងគ្នាបាន ព្រោះដាច់ប្រព័ន្ធបណ្តាញភ្ជាប់ (Network)","ម៉ាស៊ីនកុំព្យូទ័រទាំងអស់ឆេះ","ទិន្នន័យលើពពកបាត់បង់អស់"],correctAnswer:1,explanation:"អង់តែនជាផ្នែកធំចម្បងនៃប្រព័ន្ធបណ្តាញ ពេលអង់តែនខូច ដំណើរការនៃប្រព័ន្ធអេកូត្រូវកាត់ផ្តាច់ និងរអាក់រអួល។"}],references:[{title:"វីដេអូបន្ថែម៖ ស្វែងយល់ពីអ៊ីនធឺណិតនៃវត្ថុ(IOT)?",url:"https://youtu.be/FInxyJFv3Nw?si=T0UkuvXYY4l66Pv8​"}]},{id:"c1-l3",title:"មេរៀនទី ៣៖ បញ្ញាសិប្បនិម្មិត",page:"២០",objectives:["ស្គាល់ពីគំនិតមូលដ្ឋាននៃបញ្ញាសិប្បនិម្មិត (AI)","យល់ដឹងពីអត្ថប្រយោជន៍ និងការប្រើប្រាស់ AI ក្នុងជីវភាពរស់នៅប្រចាំថ្ងៃ"],content:`**១. សេចក្តីផ្តើមពី AI**
**បញ្ញាសិប្បនិម្មិត (AI - Artificial Intelligence)** គឺជាសាខាមួយនៃវិទ្យាសាស្ត្រកុំព្យូទ័រ ដែលផ្តោតលើការបង្កើតម៉ាស៊ីន ឬប្រព័ន្ធដែលមានភាពឆ្លាតវៃ មានសមត្ថភាពអាចគិត រៀនសូត្រ វែកញែក និងដោះស្រាយបញ្ហាដូចសមត្ថភាពរបស់មនុស្ស។

![Artificial Intelligence Concept](https://image.pollinations.ai/prompt/artificial+intelligence+brain+glowing+nodes+cyber+technology+vector+flat+design?width=800&height=400&nologo=true)

**២. តើ AI ដំណើរការ និងមានភាពវៃឆ្លាតយ៉ាងដូចម្តេច?**
AI មិនអាចឆ្លាតពីកំណើតនោះទេ។ ប្រព័ន្ធកុំព្យូទ័រត្រូវការ **ទិន្នន័យ (Data)** ដ៏ច្រើនសន្ធឹកសន្ធាប់សម្រាប់ការបង្វឹក និងប្រើប្រាស់សំណុំឯកសារបញ្ជា **ក្បួនដោះស្រាយ (Algorithm)** ដ៏ស្មុគស្មាញដើម្បីស្កែនរៀនពីគំរូនៃទិន្នន័យទាំងនោះ ដែលគេហៅថា **ម៉ាស៊ីនរៀន (Machine Learning)**។ 

**៣. ការអនុវត្តបញ្ញាសិប្បនិម្មិតក្នុងជីវិតប្រចាំថ្ងៃ:**
- **កម្មវិធីជំនួយការសំឡេង (Voice Assistants)៖** Siri (Apple) ឬ Google Assistant ដែលអាចស្តាប់ និងយល់ពីការបញ្ជាជាសំឡេង។
- **ការសម្គាល់ទម្រង់មុខ (Computer Vision)៖** ការដោះសោរទូរសព្ទដោយសម្គាល់ផ្ទៃមុខដោយសុវត្ថិភាព។
- **កម្មវិធីជំនួយភាសា និងការបកប្រែ (NLP)៖** Google Translate អាចបកប្រែពាក្យបានកាន់តែច្បាស់ទៅៗ។
- **ប្រព័ន្ធណែនាំដោយស្វ័យប្រវត្តិ (Recommendation Systems)៖** នៅពេលដែលលោកអ្នកមើល Facebook ឬ TikTok ប្រព័ន្ធ AI នឹងធ្វើការកត់ចំណាំនូវវីដេអូដែលអ្នកចូលចិត្តមើល ហើយវាបញ្ជូនវីដេអូទាក់ទងស្រដៀងគ្នានោះមកឲ្យដេញមើលបន្តបន្ទាប់។

**៤. អត្ថប្រយោជន៍ និងបញ្ហាប្រឈមធំៗនៃ AI៖**
- **អត្ថប្រយោជន៍៖** ធ្វើការងារស្មុគស្មាញបានលឿនជាងមនុស្ស រក្សាសុក្រឹតភាពខ្ពស់ មិនចេះហត់នឿយ និងអនុវត្តការងារគ្រោះថ្នាក់។

ndation Systems រៀនដឹងពីទម្លាប់មើលរបស់អ្នក ហើយរៀបចំបន្តុបវីដេអូទាក់ទាញមកបញ្ចាំងឲ្យឃើញ។"}],references:[{title:"វីដេអូបន្ថែម៖ តើអ្វីទៅជាបញ្ញាសិប្បនិម្មិត (AI)?",url:"https://youtu.be/LP4jupZVxGY?si=7HbR8HPlFkrEAdZ4"},{title:"វីដេអូបន្ថែម៖ តើបញ្ញាសិប្បនិម្មិតជាអ្វី?",url:"https://youtu.be/ttIOdAdQaUE?si=xd-LYEht_t6CgcL1"}]}]},{id:"c2",title:"ជំពូកទី ២៖ ទំនាក់ទំនង និងអក្ខរកម្មមេឌា",lessons:[{id:"c2-l1",title:"មេរៀនទី ១៖ ទំនាក់ទំនងតាមអ៊ីមែល",page:"២៨",objectives:["បង្កើត និងប្រើប្រាស់អ៊ីមែលបានយ៉ាងត្រឹមត្រូវប្រកបដោយសុវត្ថិភាព","យល់ដឹងពីទម្រង់ និងរបៀបសរសេរសារអេឡិចត្រូនិកផ្លូវការ"],content:`**អ៊ីមែល (Email)** គឺជាមធ្យោបាយផ្លូវការ និងពេញនិយមបំផុតសម្រាប់ការផ្ញើសារនិងឯកសារតាមរយៈអ៊ីនធឺណិតរវាងបុគ្គលនិងបុគ្គល ឬស្ថាប័ន។ កម្មវិធីពេញនិយមមានដូចជា Gmail, Outlook, និង Yahoo Mail ជាដើម។

### ផ្នែកសំខាន់ៗនៃកម្មវិធីអ៊ីមែលដែលត្រូវស្គាល់៖
- **To (ផ្ញើទៅកាន់):** កន្លែងដែលយើងវាយអាសយដ្ឋានអ៊ីមែលរបស់អ្នកទទួលផ្ទាល់។
- **Cc (Carbon Copy):** ប្រើសម្រាប់ចម្លងអ៊ីមែលនោះទៅឲ្យបុគ្គលផ្សេងទៀត ដើម្បីឱ្យពួកគេបានដឹងជាព័ត៌មាន (ជាទូទៅអ្នកដែលត្រូវបានដាក់ក្នុង Cc មិនតម្រូវឲ្យឆ្លើយតបឡើយ)។
- **Bcc (Blind Carbon Copy):** ស្រដៀងនឹង Cc ដែរ ប៉ុន្តែអាសយដ្ឋានអ៊ីមែលរបស់អ្នកដែលស្ថិតនៅកន្លែងនេះ ត្រូវបានលាក់មិនឱ្យអ្នកទទួលផ្សេងទៀតមើលឃើញឡើយ។ គេប្រើវានៅពេលផ្ញើសារទៅកាន់មនុស្សច្រើន ដោយចង់រក្សាការសម្ងាត់នៃអាសយដ្ឋានរបស់ពួកគេ។
- **Subject (ប្រធានបទ):** ប្រធានបទនៃអ៊ីមែល ត្រូវសរសេរប្រយោគខ្លីៗដែលសង្ខេបពីគោលបំណងនៃអ៊ីមែល។(ឧទាហរណ៍៖ ការស្នើសុំច្បាប់ឈប់សម្រាក)
- **Attachment (ឯកសារភ្ជាប់):** ការភ្ជាប់ឯកសារ (ដូចជារូបភាព, ឯកសារ PDF, Excel, Word ជាដើម) ចូលជាមួយសារ។

### គន្លឹះក្នុងការសរសេរអ៊ីមែលផ្លូវការ៖
១. **ការស្វាគមន៍៖** ចាប់ផ្តើមដោយការរាក់ទាក់សមរម្យ (ឧទាហរណ៍៖ ជម្រាបសួរលោកគ្រូ / Dear [ឈ្មោះ])

- **មិនរើសអើង និងគោរពគ្នា៖** ចៀសវាងការប្រើពាក្យប្រមាថធ្ងន់ធ្ងរ ការគាបសង្កត់ ការសម្លុត ឬចំអកតាមប្រព័ន្ធអ៊ីនធឺណិត (Cyberbullying)។ បើយើងមិនពេញចិត្តអ្វីមួយតាមប្រព័ន្ធអនឡាញ ជម្រើសដ៏ល្អគឺការ Block ឬ Report។ អ្នកមិនត្រូវឆ្លើយតបប៉ះទង្គិចឡើយ។`,keywords:[{term:"Digital Footprint (ស្លាកស្នាមឌីជីថល)",definition:"រាល់ស្លាកស្នាម ឬសកម្មភាពដែលអ្នកបានធ្វើ និងបន្សល់ទុកនៅលើអ៊ីនធឺណិត។"},{term:"Cyberbullying (ការគាបសង្កត់តាមប្រព័ន្ធអ៊ីនធឺណិត)",definition:"ការប្រមាថ ការមាក់ងាយ ឬការសម្លុតដោយប្រើប្រាស់ប្រព័ន្ធបច្ចេកវិទ្យា។"},{term:"Phishing",definition:"ការបោកបញ្ឆោតលួចយកព័ត៌មានឯកជនរបស់អ្នកប្រើប្រាស់។"}],quizzes:[{question:"តើអ្វីទៅជាស្លាកស្នាមឌីជីថល (Digital Footprint)?",options:["លេខកូដសម្ងាត់ទូរសព្ទ","រាល់សកម្មភាព មិនថាការចុច Like ការ Comment ឬប្រវត្តិការស្វែងរក ដែលបន្សល់ទុកលើអនឡាញ","កម្មវិធីកម្ចាត់វីរុស","រូបថតប្រូហ្វាល Facebook"],correctAnswer:1,explanation:"សកម្មភាពទាំងអស់របស់អ្នកនៅលើអ៊ីនធឺណិត បន្សល់ទុកនូវទិន្នន័យដែលអាចតាមដាន និងរកឃើញមកវិញបានជានិច្ច ទោះអ្នកលុបវាក៏ដោយ។"},{question:"Cyberbullying ផ្តល់ផលប៉ះពាល់អ្វីខ្លះដល់ជនរងគ្រោះ?",options:["ធ្វើឲ្យពួកគេសប្បាយចិត្ត","ធ្វើឲ្យកុំព្យូទ័រដើរលឿន","ប៉ះពាល់ដល់ផ្លូវចិត្ត កើតការភ័យខ្លាច និងបាក់ទឹកចិត្ត","ធ្វើឲ្យធាត់"],correctAnswer:2,explanation:"ការគាបសង្កត់អាចបន្សល់របួសផ្លូវចិត្តយ៉ាងជ្រៅ។"},{question:"តើអ្នកគួរធ្វើអ្វីបើអ្នកឃើញជនណាម្នាក់បង្ហោះរូបភាពរបស់អ្នកដោយគ្មានការអនុញ្ញាត?",options:["ជេរតបវិញ","ប្រមូលមិត្តភក្តិទៅវាយ","រាយការណ៍ (Report) ឬ ប្រាប់ទៅអាណាព្យាបាល និងភាគីពាក់ព័ន្ធ","បង្ហោះរូបអាក្រក់របស់គេសងវិញ"],correctAnswer:2,explanation:"រាយការណ៍តាមប្រព័ន្ធ ឬសុំជំនួយពីអ្នកធំជារឿងត្រឹមត្រូវបំផុតដើម្បីតាមផ្លូវច្បាប់។"},{question:"ហេតុអ្វីមិនគួរចែករំលែកព័ត៌មានដូចជា អត្តសញ្ញាណប័ណ្ណ រឺ លេខទូរសព្ទ តាមអនឡាញ?",options:["ខ្លាចទូរសព្ទខូច","ដើម្បីចៀសវាងការវាយប្រហារបន្លំ (Phishing) និងការលួចបញ្ជាក់អត្តសញ្ញាណ","ខ្លាចអ៊ីនធឺណិតដើរយឺត","ខ្លាចមិត្តភក្តិដឹង"],correctAnswer:1,explanation:"ព័ត៌មានផ្ទាល់ខ្លួនអាចត្រូវជនទុច្ចរិតលួចយកទៅឆបោក។"},{question:"ការពាក្យពេចន៍ចំអក ឬប្រមាថអ្នកដទៃ (Cyberbullying) តាមអនឡាញ គឺជាអ្វី?",options:["ការលេងសើចធម្មតា","អាកប្បកិរិយាខ្វះសីលធម៌ដែលត្រូវចៀសវាង និងអាចខុសច្បាប់","ការបង្ហាញភាពក្លាហាន","សិទ្ធិបញ្ចេញមតិ"],correctAnswer:1,explanation:"វាមិនមែនជាសិទ្ធិទេ វាជាការបៀតបៀនអ្នកដទៃដែលត្រូវថ្កោលទោស។"}],references:[{title:"វីដេអូបន្ថែម៖ ក្រមសីលធម៌បុគ្គលក្នុងប្រព័ន្ធផ្សព្វផ្សាយ",url:"https://youtu.be/dzO3UGharmg?si=1c8dYTt2Yyqa_NVo"},{title:"វេបសាយ៖ Moral Machine",url:"https://www.moralmachine.net/"}]}]},{id:"c3",title:"ជំពូកទី ៣៖ ក្បួនដោះស្រាយ",lessons:[{id:"c3-l1",title:"មេរៀនទី ១៖ ប្រព័ន្ធរបាប់ និងប្រមាណវិធី",page:"៤៦",objectives:["យល់ដឹងពីគោលគំនិតនៃប្រព័ន្ធរបាប់គោលពីរ (Binary System) និងប្រព័ន្ធគោលដប់ (Decimal System)","អាចដោះស្រាយចំណោទការបំប្លែងរវាងប្រព័ន្ធគោលពីរ និងប្រព័ន្ធគោលដប់ជាដើមទុនក្នុងការសរសេរកូដ"],content:`**សេចក្តីផ្តើមពីប្រព័ន្ធរបាប់ (Number System and Arithmetic Operations)**

1. **អាណាឡូក និងឌីជីថល (Analog vs Digital)**
ទិន្នន័យ និងព័ត៌មានអាចត្រូវបានបង្ហាញជាពីរទម្រង់៖ អាណាឡូក ឬ ឌីជីថល។ 
- **អាណាឡូក (Analog):** ផ្ដល់តម្លៃដែលប្រែប្រួលជាបន្តបន្ទាប់ ដូចជាសំឡេង ពន្លឺ ឬសីតុណ្ហភាព។ ព័ត៌មានអាណាឡូកមានភាពសុក្រឹត ប៉ុន្តែពិបាកក្នុងការចែកដាច់ពីគ្នាយ៉ាងច្បាស់លាស់។ (ឧ. នាឡិកាមានទ្រនិច)
- **ឌីជីថល (Digital):** សំដៅលើការបង្ហាញព័ត៌មានតាមលក្ខណៈជាលេខ ដែលប្រព័ន្ធកុំព្យូទ័រអាចយល់ និងដំណើរការបាន។ វាផ្តល់ភាពងាយស្រួលក្នុងការកែសម្រួល ចម្លង និងចែកចាយដោយធានាមិនខូចគុណភាពទម្រង់ដើម។ (ឧ. នាឡិកាលេខ)

![Analog vs Digital](https://image.pollinations.ai/prompt/analog+and+digital+technology+comparison+clocks+flat+vector+design?width=800&height=400&nologo=true)

2. **តំណាងទិន្នន័យជាឌីជីថល (Bit និង Byte)**
កុំព្យូទ័រមិនអាចយល់ភាសាមនុស្សទេ វាប្រើប្រាស់សញ្ញាអគ្គិសនីតែពីរគឺ "បើក (ON)" និង "បិទ (OFF)" ដែលតំណាងដោយលេខ 1 និងលេខ 0។ លេខទាំងនេះហៅថា **លេខគោលពីរ (Binary number)**។
- **Bit (Binary Digit):** ជាឯកតាតូចបំផុត អាចបង្ហាញតែតម្លៃ 0 ឬ 1 ប៉ុណ្ណោះ។
- **Byte (បៃ):** បណ្ដុំនៃ 8 bits (1 byte = 8 bits) ទើបអាចតំណាងឱ្យតួអក្សរមួយបាន។ ការផ្ទុកទិន្នន័យកាន់តែធំ តម្រូវឲ្យប្រើចំនួនប៊ីតកាន់តែច្រើន (ឧទាហរណ៍៖ 1KB = 1024 Bytes)។

3. **ប្រព័ន្ធគោលដប់ និងប្រព័ន្ធគោលពីរ**
- **ប្រព័ន្ធគោលដប់ (Decimal System - Base 10):** ជារបៀបរាប់ក្នុងជីវភាពពិតដែលយើងប្រើជាប្រចាំ មានតួអក្សរលេខ ១០ខ្ទង់ (0 ដល់ 9)។ 
- **ប្រព័ន្ធគោលពីរ (Binary System - Base 2):** ជាប្រព័ន្ធដែលកុំព្យូទ័រប្រើ មាន២ខ្ទង់គត់ (0 និង 1)។ ព័ត៌មានផ្សេងៗទៀតដូចជាអត្ថបទ រូបភាព សំឡេង សុទ្ធតែត្រូវបានបំប្លែងទៅជាលេខកូដគោលពីរនេះ។ ឧទាហរណ៍ផ្សេងទៀតដែលប្រើគោលការណ៍កូដគោលពីរ គឺ កូដ Barcode (ចំណាំងខ្មៅ និងស) និងកូដ Morse។

![Binary Code Interpretation](https://image.pollinations.ai/prompt/binary+code+number+system+computer+technology+vector+flat+design?width=800&height=400&nologo=true)

4. **ការបំប្លែងប្រព័ន្ធរាប់ (Base Conversion)**
- **ពីគោលដប់ ទៅ គោលពីរ (Decimal to Binary):** ចែកលេខគោលដប់នឹង ២ ជាបន្តបន្ទាប់រហូតដល់ផលចែកស្មើនឹង 0 រួចយកសំណល់រៀបបញ្ច្រាសពីក្រោមមកលើ។
- **ពីគោលពីរ ទៅ គោលដប់ (Binary to Decimal):** យកលេខគោលពីរនីមួយៗគុណនឹង ២ ជាស្វ័យគុណតាមតំណែងខ្ទង់ (ចាប់ពីស្វ័យគុណសូន្យនៅខាងស្តាំគេបង្អស់) រួចបូកលទ្ធផលបញ្ជូលគ្នា។

,correctAnswer:0,explanation:"របៀបគណនាគឺ៖ (1×2²) + (0×2¹) + (1×2⁰) = 4 + 0 + 1 = 5។"}],references:[{title:"បញ្ជាប់ទៅកាន់វេបសាយប្រព័ន្ធគោលពីរ",url:"https://ryseyla2025-png.github.io/KhBinary/"},{title:"បញ្ជាប់ទៅកាន់វេបសាយ​ CS Unplugged Binary",url:"https://www.csunplugged.org/en/topics/binary-numbers/"},{title:"វីដេអូបន្ថែមទី១៖ ស្វែងយល់ពីប្រព័ន្ធគោលពីរនិងតក្កវិទ្យា",url:"https://youtu.be/hvteVokz7jE?si=4V-13P-FZLxcgXmN"},{title:"វីដេអូបន្ថែមទី២៖ ការបំលែងប្រព័ន្ធគោលពីរទៅគោលដប់",url:"https://youtu.be/lCFS54Ifk3Q?si=OToiA9_NTEQW-Zsv"},{title:"វីដេអូបន្ថែមទី៣៖ How Binary Digit Works",url:"https://youtu.be/Wy6-FXtLMV8?si=zwPcl1Qa8KtfatH0"}]},{id:"c3-l2",title:"មេរៀនទី ២៖ ការគិតសមហេតុផល និងតាមលំដាប់លំដោយ",page:"៥៦",objectives:["បំបែកបញ្ហាស្មុគស្មាញជាជំហានតូចៗតាមប្រព័ន្ធក្បួនដោះស្រាយ (Algorithm)","គូរគំនូសបំព្រួញ (Flowchart) ដើម្បីរៀបចំហូរនៃការដោះស្រាយបញ្ហា"],content:`**ការគិតជាលំដាប់លំដោយ (Sequential Thinking)** គឺជាការរៀបចំជំហាននីមួយៗឲ្យបានច្បាស់លាស់និងបន្តបន្ទាប់គ្នាមុននឹងដោះស្រាយបញ្ហាអ្វីមួយ ដែលជាភាពចាំបាច់បំផុតសម្រាប់ការសរសេរកូដបញ្ជាម៉ាស៊ីនកុំព្យូទ័រ។

៤. រង់ចាំដល់ទឹកពុះ។`,keywords:[{term:"Algorithm (ក្បួនដោះស្រាយ)",definition:"ទម្រង់ ឬជំហានតាមលំដាប់លំដោយ ដើម្បីដោះស្រាយបញ្ហាអ្វីមួយ។"},{term:"Flowchart (គំនូសបំព្រួញ)",definition:"ការគូររូបតំណាងនៃក្បួនដោះស្រាយដោយប្រើប្រាស់និមិត្តសញ្ញា។"}],quizzes:[{question:"តើអ្វីទៅជាក្បួនដោះស្រាយ (Algorithm)?",options:["ផ្នែករឹងរបស់កុំព្យូទ័រ (Hardware)","ជំហាន ឬនីតិវិធីជាលំដាប់លំដោយ ដើម្បីដោះស្រាយបញ្ហាអ្វីមួយពីដើមដល់ចប់","ការរចនារូបភាព","ឈ្មោះកម្មវិធីអ៉ីនធឺណិត"],correctAnswer:1,explanation:"Algorithm គឺជាស៊េរីជំហានដែលយើងបង្រៀនកុំព្យូទ័រឲ្យធ្វើការងារ ឬដោះស្រាយបញ្ហា។"},{question:"ជម្រើសណាមួយដែលបង្ហាញពីឧទាហរណ៍នៃក្បួនដោះស្រាយក្នុងជីវភាពប្រចាំថ្ងៃ?",options:["ដើមឈើដុះស្លឹក","ការរៀបចំវិចខ្ចប់សៀវភៅតាមលំដាប់ម៉ោងរៀន","ខ្យល់បក់","ការដកដង្ហើមពេលគេង"],correctAnswer:1,explanation:"ការធ្វើសកម្មភាពតាមជំហានគិតទុកមុនយ៉ាងច្បាស់លាស់ គឺជា Algorithm។"},{question:"តើ 'Flowchart (គំនូសបំព្រួញ)' មានមុខងារអ្វី?",options:["ប្រើសម្រាប់ពណ៌នាជំហាននៃក្បួនដោះស្រាយ ដោយប្រើនិមិត្តសញ្ញារូបភាពផ្សេងៗ","ប្រើសម្រាប់ថតរូប","ប្រើសម្រាប់គណនាលេខបូកដក","ជាប្រភេទវីដេអូហ្គេម"],correctAnswer:0,explanation:"Flowchart ជួយឲ្យយើងមើលឃើញលំហូរនៃការគិតជាជំហានៗច្បាស់លាស់។"},{question:"នៅក្នុង Flowchart តើរូបរាងពងក្រពើ (Oval) តំណាងឲ្យអ្វី?",options:["ចំណុចចាប់ផ្តើម និងបញ្ចប់ (Start/End)","ដំណើរការ (Process)","ការសម្រេចចិត្ត (Decision)","កាតាបទិន្នន័យ"],correctAnswer:0,explanation:"រូបពងក្រពើ ឬ រង្វង់ទ្រវែង ច្រើនប្រើនៅក្បាល និងចុងនៃ Flowchart។"},{question:"តើ Pseudocode (កូដក្លែងក្លាយ) គឺជាអ្វី?",options:["កូដកុំព្យូទ័រដែលប្រើការមិនកើត","ការសរសេរប្រយោគខ្លីៗដែលស្រដៀងអក្សរធម្មតា និងកូដ ដើម្បីបរិយាយពីក្បួនដោះស្រាយ មុននឹងសរសេរកូដពិត","មេរោគកុំព្យូទ័រ","លេខកូដសុវត្ថិភាព"],correctAnswer:1,explanation:"Pseudocode ជួយអ្នកសរសេរកម្មវិធីរៀបចំគម្រោងគិតមុនពេលវាយភាសាកូដពិតប្រាកដ។"}],references:[{title:"វីដេអូបន្ថែម៖ អ្វីទៅជា Algorithm?",url:"https://youtu.be/kM9ASKAni_s?si=wPf8BK-NNy_QF9ki"},{title:"វីដេអូបន្ថែម៖ ការណែនាំពីក្បួនដោះស្រាយ",url:"https://youtu.be/_YoXMAKk9zg?si=v1JWEsl1yiVjjL-b"}]},{id:"c3-l3",title:"មេរៀនទី ៣៖ អថេរ និងអនុគមន៍",page:"៦០",objectives:["ពន្យល់បានពីបញ្ញត្តិ និងតម្លៃនៃការបង្កើតអថេរ និងអនុគមន៍","ស្វែងយល់ដឹងពីរបៀបបង្កើតប្លុកផ្ទាល់ខ្លួន (My Blocks) នៅក្នុង Scratch ដើម្បើប្រើជាអនុគមន៍"],content:`**១. បញ្ញត្តិ និងការប្រើប្រាស់អថេរ (Variable)**
ខណៈពេលដែលកម្មវិធីកំពុងដំណើរការ កុំព្យូទ័រត្រូវការកន្លែងសម្រាប់រក្សាទុកទិន្នន័យបណ្តោះអាសន្ន ដើម្បីយកមកប្រើប្រាស់នៅពេលចាំបាច់ កន្លែងរក្សាទុកនោះត្រូវបានគេហៅថា **អថេរ (Variable)**។ អថេរនីមួយៗមានឈ្មោះតំណាង ដើម្បីងាយស្រួលចំណាំ។

- **ប្រភេទអថេរប្រែប្រួល៖** អថេរអាចរក្សាទុកទិន្នន័យបានច្រើនប្រភេទដូចជា លេខ តួអក្សរ ឬលំដាប់តួអក្សរ (String)។ តម្លៃដែលស្ថិតនៅក្នុងអថេរ អាចត្រូវបានប្ដូរ ឬកែប្រែ (Update) ជានិច្ចក្នុងពេលកូដកំពុងរត់។
- **ការកំណត់តម្លៃដំបូង (Initialization)：** រាល់ពេលបង្កើតអថេរ យើងគប្បីកំណត់តម្លៃឆ្លងកាត់របស់វាជាមុន (ឧទាហរណ៍ទាញយកប្លុកកូដ \`Set [Variable] to 0\`)។ បើមិនដូច្នោះទេ តម្លៃរបស់វាអាចានភាពមិនច្បាស់លាស់។
- **ការហៅអថេរយកមកប្រើ៖** ក្នុងគម្រោង Scratch អ្នកគ្រាន់តែចូលទៅកាន់មុខងារ Variables រួចចុច "Make a Variable" បន្ទាប់មកទាញឈ្មោះវាទៅដាក់ក្នុងប្រមាណវិធីណាមួយដែលចង់ប្រើ។

![Variables Concept](https://image.pollinations.ai/prompt/variables+in+programming+data+boxes+concept+flat+vector+design?width=800&height=400&nologo=true)

**២. បញ្ញត្តិ និងការប្រើប្រាស់អនុគមន៍ (Function / My Blocks)**
- **អនុគមន៍ជាអ្វី?** អនុគមន៍ (Function) គឺជាបណ្ដុំនៃកូដមួយជួរ ឬមួយដុំ ដែលចងក្រងឡើងដើម្បីអនុវត្តកិច្ចការ ឬប្រតិបត្តិការជាក់លាក់ណាមួយ។ 
- **ហេតុអ្វីត្រូវមានអនុគមន៍?** នៅពេលកម្មវិធីយើងធំ និងមានកិច្ចការដដែលៗ ជំនួសឲ្យការប្រកបកូដដ៏វែងអន្លាយ យើងអាចបំបែកកូដទាំងនោះជា "បន្ទប់ៗ" រួចដាក់ឈ្មោះឲ្យវា។ ពេលចង់ប្រើ យើងគ្រាន់តែ **"ហៅឈ្មោះអនុគមន៍"** នោះមកជាការស្រេច។ ចំណុចនេះជួយឲ្យកូដខ្លី ងាយស្រួលមើល និងមានសណ្ដាប់ធ្នាប់ល្អ។

",options:["កុំព្យូទ័រដើរយឺត","វិធីសាស្ត្រ Abstraction","វីរុស","កម្លាំងអគ្គិសនី"],correctAnswer:1,explanation:"Abstraction គឺជាឧបករណ៍សំខាន់បំផុតរបស់វិស្វករសម្រាប់ដោះស្រាយបញ្ហាធំៗដោយមិនវង្វេង។"}],references:[{title:"វីដេអូបន្ថែម៖ ស្វែងយល់ពីអរូបីកម្ម",url:"https://youtu.be/jV-7Hy-PF2Q?si=xU2qPHKAUJdHeOa5"}]},{id:"c3-l5",title:"មេរៀនទី ៥៖ ឃ្លាលក្ខខណ្ឌ",page:"៩២",objectives:["ស្វែងយល់ពីការប្រើប្រាស់ និងរចនាសម្ព័ន្ធនៃបញ្ជាឃ្លាលក្ខខណ្ឌ (If...Else)","អនុវត្តកូដដើម្បីឲ្យកុំព្យូទ័រចេះធ្វើការសម្រេចចិត្តប្រែប្រួលតាមស្ថានភាព"],content:`**ឃ្លាលក្ខខណ្ឌ (Conditionals)** ត្រូវបានប្រើប្រាស់នៅពេលដែលយើងចង់ឱ្យកុំព្យូទ័រធ្វើការសម្រេចចិត្តផ្សេងៗគ្នា ផ្អែកលើស្ថានភាព ឬលក្ខខណ្ឌដែលវាកំពុងជួបប្រទះ (ឧទាហរណ៍រចនាសម្ព័ន្ធ \`If...Else\` ជាដើម)។ នេះគឺជាអ្វីដែលធ្វើឲ្យកម្មវិធីមានភាពវៃឆ្លាត។

**ឧទាហរណ៍ការគិត៖**
- **ប្រសិនបើ (If)** មេឃកំពុងភ្លៀង
